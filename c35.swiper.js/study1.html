<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스와이퍼</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <style>
        .station1 {
            width: 700px;
            height: 350px;
            border: 1px solid red;
        }

        .station2 {
            width: 1200px;
            height: 800px;
            border: 1px solid blue;
        }

        .station2 .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .station3 {
            width: 100%;
            height: 600px;
            border: 1px solid green;
        }

        .station3 .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>
    //태그 정렬 alt+shift+f, 한꺼번에 바꾸기 alt+ctrl+방향키, 리소스>데모에서 코드 복붙하기
    <div class="swiper station1">
        <div class="swiper-wrapper">
            <div class="swiper-slide">Slide 1</div>
            <div class="swiper-slide">Slide 2</div>
            <div class="swiper-slide">Slide 3</div>
            <div class="swiper-slide">Slide 4</div>
            <div class="swiper-slide">Slide 5</div>
        </div>
    </div>

    <div class="swiper station2">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img src="./img/김예림.png" alt="김예림">
            </div>
            <div class="swiper-slide">
                <img src="./img/김하경.png" alt="김하경">
            </div>
            <div class="swiper-slide">
                <img src="./img/김현아.jpg" alt="김현아">
            </div>
            <div class="swiper-slide">
                <img src="./img/박민주.png" alt="박민주">
            </div>
            <div class="swiper-slide">
                <img src="./img/배수정.png" alt="배수정">
            </div>
            <div class="swiper-slide">
                <img src="./img/백민선.png" alt="백민선">
            </div>
            <div class="swiper-slide">
                <img src="./img/성대한.png" alt="성대한">
            </div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <div class="swiper station3">
        <div class="swiper-wrapper"></div>
    </div>

    <script>
        const station1 = new Swiper('.station1', {
            loop: true,
            direction: 'vertical'
        });

        const station2 = new Swiper('.station2', {
            loop: true,
            slidesPerView: 1.2,
            autoplay: {
                delay: 1000
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        })

        // station2의 슬라이드 내용을 station3에도 동일하게 사용합니다.
        document.querySelector('.station3 .swiper-wrapper').innerHTML =
            document.querySelector('.station2 .swiper-wrapper').innerHTML;

        const station3 = new Swiper('.station3', {
            loop: true,
            slidesPerView: 2.2,
            spaceBetween: 30,
            autoplay: {
                delay: 1000,
            },
        });
    </script>
</body>

</html>
