<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function - 함수</title>
</head>
<body>
    <script>
        // alert('안녕하세요')
        // console.log('안녕하세요')
        // prompt('이름입력하세요')
        // Number('100')

        function a(){
            alert('안녕하세요')
        }
        // a() //실행
        // a() //2번 실행

        function b(name,age){
            document.write(`<p>${name}님 안녕하세요</p>`)
            document.write(`<p>${name}님은 ${age}살 이시군요</p>`)
        }
        b('정현진',45)
        b('정선민',20)

        function c(person){
            document.write(`<p>${person[0]}님 반갑습니다.</p>`)
            document.write(`<p>${person[0]}님은 ${person[1]}세이시군요.</p>`)
        }

        c(['정현진',44])

        function d(person){
            document.write(`<p>${person.name}님 반갑습니다.</p>`)
            document.write(`<p>${person.name}님은 ${person.age}세이시군요.</p>`)
        }

        d({name:'함국주',age:25})

        function e(){
            alert('히히')
            return 3 //함수 종료, 3은 남겨짐
            alert('헤헤')
        }

        // alert(e()) // '히히', 3

        // let result1 = e() // result라는 변수에 e()저장. '히히'는 실행되고, 실행되지 않은 3은 남겨짐
        // console.log(result1)

        function g(name){
            document.write(`<p>${name}님 좋은아침입니다.</p>`)
            // return name[0] // 배
            return {na:name} // {na:'배수정'} 계산됨
        }

        g('배수정') // 실행후 '배수정' 남아있음. return 오른쪽 값

        // let user= g('배수정')
        // // alert(user)
        // alert(user.na)

        function getAver(score){
            return (score[0]+score[1]+score[2])/3
        }

        alert(getAver([98,87,100]))



        
    </script>
</body>
</html>
