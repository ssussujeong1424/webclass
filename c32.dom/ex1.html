<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글씨크기조절</title>
    <link rel="stylesheet" href="./css/ex1.css">
    <script src="./js/ex1.js"></script>
</head>
<body>
    <div class="fontControl">
        <span id="btn-toggle"><img src="./img/menu.svg" alt="메뉴"></span>
        <span id="btn-font-up">크게</span>
        <span id="btn-font-down">작게</span>
    </div>
    <div class="wrap">
        <h1>작은 습관의 힘</h1>
        <p>매일 반복하는 작은 행동은 생각보다 큰 변화를 만듭니다.</p>
        <h2>오늘부터 실천할 수 있는 습관</h2>
        <p>아침에 일어나 물 한 잔을 마시며 하루를 시작해 보세요.</p>
        <p>해야 할 일을 세 가지로 정리하면 우선순위를 잡기 쉽습니다.</p>
        <p>잠들기 전에는 오늘 잘한 일을 하나씩 떠올려 보세요.</p>
        <p>완벽하지 않아도 꾸준히 이어 가는 것이 가장 중요합니다.</p>
    </div>
</body>
</html>
