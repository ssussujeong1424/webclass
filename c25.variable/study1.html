    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수 - variable</title>
</head>
<body>
    <script>
        10//상수
        12//상수
        '안녕'//상수
        let a;//a라는 변수를 선언함
        a = 10;//a라는 변수를 10으로 초기화

        console.log(a)

        console.log(b)
        b = '하세요'
        console.log(b)
        console.log(a+b)
        let c = a+b
        console.log(c)
        console.log(c[2]+c[4])
        let d;

        var abc=30;
        const BIRTH='0427'
        console.log(BIRTH)
        
    </script>
</body>
</html>
