<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적표</title>
    <link rel="stylesheet" href="ex1.css">
</head>
<body>
    <script>
        let userName = prompt('당신의 이름을 입력해주세요')
        let sK = Number(prompt('당신의 국어점수를 입력해주세요'))
        let sE = Number(prompt('당신의 영어점수를 입력해주세요'))
        let sM = Number(prompt('당신의 수학점수를 입력해주세요'))
        let sS = Number(prompt('당신의 사회점수를 입력해주세요'))
        let sa = sK+sE+sM+sS
        let sv =(sa/4).toFixed(2)

        document.write(`    <table border="1">
        <caption>${userName}님의 성적표</caption>
        <tr>
            <th>이름</th>
            <td>${userName}</td>
        </tr>
        <tr>
            <th>국어</th>
            <td>${sK}점</td>
        </tr>
            <tr>
            <th>영어</th>
            <td>${sE}점</td>
        </tr>
        <tr>
            <th>수학</th>
            <td>${sM}점</td>
        </tr>
        <tr>
            <th>사회</th>
            <td>${sS}점</td>
        </tr>
        <tr>
            <th>합계</th>
            <td>${sa}점</td>
        </tr>
        <tr>
            <th>평균</th>
            <td>${sv}</td>
        </tr>
    </table>`)
    </script>
    
</body>
</html>
