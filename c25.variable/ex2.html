<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI 계산기</title>
    <link rel="stylesheet" href="ex2.css">
</head>
<body>
    <main class="bmi-page">
        <script>
            let userName = prompt('이름을 입력해 주세요')
            let kg = Number(prompt('몸무게(kg)를 입력해 주세요'))
            let cm = Number(prompt('키(cm)를 입력해 주세요'))
            let bmi = kg / ((cm / 100) ** 2)

            document.write(`
                <section class="bmi-card">
                    <h1>${userName}의 체질량 지수(BMI)</h1>
                    <p class="description">BMI는 몸무게(kg)를 키(m)의 제곱으로 나눈 값입니다.
                    체질량지수는 근육량, 유전적 원인, 다른 개인적 차이를 반영하지 못하는 단점이 있음에도 불구하고 조사자들이나 의료인들이 가장 많이 쓰는 방법 중 하나입니다.</p>
                    <table class="result-table">
                        <tbody>
                            <tr><th scope="row">이름</th><td>${userName}</td></tr>
                            <tr><th scope="row">체중</th><td>${kg} kg</td></tr>
                            <tr><th scope="row">키</th><td>${cm} cm</td></tr>
                            <tr><th scope="row">BMI 지수</th><td>${bmi.toFixed(2)}</td></tr>
                        </tbody>
                    </table>
                </section>

                <section class="guide-card">
                    <table class="bmi-guide">
                        <thead>
                            <tr>
                                <th scope="col">BMI</th>
                                <th scope="col">18.5</th>
                                <th scope="col">23</th>
                                <th scope="col">25</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><span class="grade underweight">저체중</span></td>
                                <td><span class="grade normal">정상</span></td>
                                <td><span class="grade overweight">과체중</span></td>
                                <td><span class="grade obese">비만</span></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr><th colspan="4" scope="row">체중</th></tr>
                        </tfoot>
                    </table>
                </section>
            `)
        </script>
    </main>
</body>
</html>
