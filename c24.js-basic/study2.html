<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산 도구</title>
</head>
<body>
    <script>
        console.log(Math.ceil(5.33)) //소수점 올림
        console.log(Math.floor(5.99)) //소수점 내림
        console.log(Math.round(5.5)) //소수점 반올림
        console.log(Math.pow(10,2)) //10의 2제곱
        console.log(Math.sqrt(100)) //100의 루트계산=10
        console.log(Math.abs(-30)) //절대값 계산
        console.log(Math.max(3,1,4,5,21)) //최대값 표시
        console.log(Math.min(1,2,3,4)) //최소값 표시
        console.log(Math.random()) //랜덤수 뽑기 0,1 제외 0.x 소수나옴
        console.log(Math.round((Math.random()*44))+1)
        console.log(3.141592342353.toFixed(3))
    </script>
</body>
</html>
