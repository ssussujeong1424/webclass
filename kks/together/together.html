<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함께 보면 좋은 제품</title>
    <link rel="stylesheet" href="../footer/common.css">
    <link rel="stylesheet" href="./together.css">
    <link rel="stylesheet" href="./react-tgt.css">
    <script src="./tgt.js" defer></script>
</head>

<body>

    <!-- PC - 함께 보면 좋은 제품 -->
    <div class="together">
        <div class="tgt-top">
            <ul class="tgt-txt">
                <li class="tgt-underline">
                    <h3><b>함께 보면 좋은 제품</b></h3>
                </li>
                <li class="tgt-color">
                    <h3><b>최근 본 제품</b></h3>
                </li>
            </ul>
        </div>
        <div class="tgt-img">
            <ul>
                <li>
                    <img src="./img/tgt1.jpg" alt="아로마티크 핸드 밤">
                    <div class="tgt-caption">
                        <div class="tgt-caption-1">

                            <h4><b>아로마티크 핸드 밤</b></h4>
                            <h4>건성 피부, 영양 공급이 필요한 피부</h4>
                        </div>
                        <div class="tgt-caption-2">
                            <h4>60 mL</h4>
                            <h4><b>39,000원</b></h4>
                        </div>
                    </div>
                    <div class="tgt-button">
                        <a href="#"><h4><b>장바구니에 담기</b></h4></a>
                    </div>
                </li>

                <li>
                    <img src="./img/tgt2.jpg" alt="선릿 브레스리스 바디 오일">
                    <div class="tgt-caption">
                        <div class="tgt-caption-1">
                            <h4><b>선릿 브레스리스 바디 오일</b></h4>
                            <h4>건조한 피부, 수분 공급이 필요한 피부</h4>
                        </div>
                        <div class="tgt-caption-2">
                            <h4>100 mL</h4>
                            <h4><b>49,000원</b></h4>
                        </div>
                    </div>
                    <div class="tgt-button">
                        <a href="#"><h4><b>장바구니에 담기</b></h4></a>
                    </div>
                </li>

                <li>
                    <img src="./img/tgt3.jpg" alt="선릿 시더우드 아틀라스 클렌저">
                    <div class="tgt-caption">
                        <div class="tgt-caption-1">

                            <h4><b>선릿 시더우드 아틀라스 클렌저</b></h4>
                            <h4>모든 피부 타입, 데일리 세정에 이상적</h4>
                        </div>
                        <div class="tgt-caption-2">
                            <h4>120 mL</h4>
                            <h4><b>42,000원</b></h4>
                        </div>
                    </div>
                    <div class="tgt-button">
                        <a href="#"><h4><b>장바구니에 담기</b></h4></a>
                    </div>
                </li>
            </ul>
        </div>

    </div>
</body>

</html>
